<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PEAK VISION | إنتاج إعلامي وحلول بصرية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-black:#0c0403;
    --bg-deep:#30363c;
    --bg-mid:#3a0d0d;
    --red:#e1261c;
    --red-bright:#ff3b30;
    --gold:#937e73;
    --gold-soft:#937e73;
    --ink:#f4ede9;
    --ink-dim:#b8a9a4;
    --ink-faint:#7a6863;
    --line:rgba(244,237,233,0.09);
    --card:rgba(255,255,255,0.03);
    --display: 'Oswald', 'Cairo', sans-serif;
    --arabic: 'Cairo', sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth; overflow-x:hidden; max-width:100%;}
  body{
    background:var(--bg-black);
    color:var(--ink);
    font-family:var(--arabic);
    overflow-x:hidden;
    max-width:100%;
    position:relative;
  }
  img{max-width:100%; height:auto; display:block;}
  body::before{
    content:'';
    position:fixed;
    inset:0;
    background:
      radial-gradient(ellipse 900px 600px at 50% -5%, var(--bg-mid), transparent 60%),
      radial-gradient(ellipse 700px 500px at 90% 30%, rgba(225,38,28,0.10), transparent 60%),
      radial-gradient(ellipse 700px 500px at 5% 70%, rgba(232,165,61,0.06), transparent 60%),
      var(--bg-black);
    z-index:-2;
  }
  body::after{
    content:'';
    position:fixed;
    inset:0;
    background-image:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 3px);
    z-index:-1;
    pointer-events:none;
  }
  a{color:inherit;text-decoration:none;}
  ul{list-style:none;}
  .wrap{max-width:1240px;margin:0 auto;padding:0 32px;}
  .eyebrow{
    font-family:var(--display);
    font-size:12.5px;
    letter-spacing:0.32em;
    text-transform:uppercase;
    color:var(--gold);
    font-weight:600;
  }
  .eyebrow-row{
    display:inline-flex;
    align-items:center;
    gap:9px;
    justify-content:center;
  }
  .eyebrow-icon-badge{
    display:flex;align-items:center;justify-content:center;
    width:26px;height:26px;
    border-radius:50%;
    border:1px solid rgba(232,165,61,0.35);
    background:rgba(232,165,61,0.08);
    flex-shrink:0;
  }
  .eyebrow-icon-badge svg{width:13px;height:13px;color:var(--gold);}
  .icon{width:22px;height:22px;display:inline-block;vertical-align:middle;}

  /* NAV */
  header{
    position:fixed;top:0;left:0;right:0;
    z-index:100;
    background:rgba(12,4,3,0.72);
    backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);
  }
  nav.wrap{
    display:flex;align-items:center;justify-content:space-between;
    height:76px;
  }
  .logo-mark{display:flex;align-items:center;gap:10px;}
  .logo-mark img{height:34px;width:auto;filter:brightness(0) invert(1);}
  .nav-links{display:flex;gap:36px;align-items:center;}
  .nav-links a{
    font-family:var(--display);
    font-size:14px;
    letter-spacing:0.03em;
    color:var(--ink-dim);
    font-weight:500;
    transition:color .25s;
    position:relative;
  }
  .nav-links a.active{color:var(--ink);}
  .nav-links a:hover{color:var(--gold-soft);}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:9px;
    font-family:var(--arabic);
    font-weight:700;
    font-size:15px;
    padding:13px 30px;
    border-radius:6px;
    border:1.5px solid transparent;
    cursor:pointer;
    transition:transform .2s, box-shadow .2s, background .2s;
    white-space:nowrap;
  }
  .btn svg{width:17px;height:17px; flex-shrink:0;}
  .btn-outline{
    border-color:var(--red);
    color:var(--ink);
    background:transparent;
  }
  .btn-outline:hover{background:rgba(225,38,28,0.12); transform:translateY(-2px);}
  .btn-solid{
    background:linear-gradient(135deg, var(--red-bright), var(--red) 70%);
    color:#fff;
    box-shadow:0 8px 24px -8px rgba(225,38,28,0.7);
  }
  .btn-solid:hover{transform:translateY(-2px); box-shadow:0 12px 30px -8px rgba(225,38,28,0.85);}
  .nav-cta{display:none;}

  /* HERO */
  .hero{
    min-height:100vh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;
    padding:160px 24px 100px;
    position:relative;
  }
  .hero-logo{
    width:min(380px, 70vw);
    margin-bottom:38px;
    opacity:0;
    animation:riseIn .9s ease forwards;
  }
  .hero-logo img{width:100%; display:block; filter: drop-shadow(0 10px 40px rgba(0,0,0,0.5));}
  .hero h1{
    font-family:var(--arabic);
    font-weight:900;
    font-size:clamp(32px, 5.2vw, 64px);
    line-height:1.35;
    max-width:1000px;
    opacity:0;
    animation:riseIn .9s ease .15s forwards;
  }
  .hero h1 .accent-gold{color:var(--gold);}
  .hero h1 .accent-red{color:var(--red-bright);}
  .hero .sub{
    font-family:var(--display);
    margin-top:26px;
    font-size:clamp(13px,1.6vw,18px);
    letter-spacing:0.3em;
    text-transform:uppercase;
    color:var(--ink-faint);
    font-weight:400;
    opacity:0;
    display:inline-flex;
    align-items:center;
    gap:12px;
    animation:riseIn .9s ease .3s forwards;
  }
  .hero .sub svg{width:16px;height:16px; color:var(--gold); flex-shrink:0;}
  .hero-ctas{
    margin-top:48px;
    display:flex;gap:18px;flex-wrap:wrap;justify-content:center;
    opacity:0;
    animation:riseIn .9s ease .45s forwards;
  }
  @keyframes riseIn{
    from{opacity:0; transform:translateY(22px);}
    to{opacity:1; transform:translateY(0);}
  }

  section{position:relative; padding:110px 0;}
  .section-head{text-align:center; max-width:720px; margin:0 auto 60px;}
  .section-head h2{
    font-family:var(--arabic);
    font-weight:800;
    font-size:clamp(28px,3.6vw,42px);
    line-height:1.25;
    margin-top:16px;
    letter-spacing:-0.01em;
    color:var(--ink);
  }
  .section-head h2::after{
    content:'';
    display:block;
    width:52px;height:3px;
    margin:20px auto 0;
    border-radius:3px;
    background:linear-gradient(90deg, var(--red-bright), var(--gold));
  }
  .section-head p{
    margin-top:22px;
    color:var(--ink-dim);
    font-size:17px;
    line-height:1.8;
  }

  /* ABOUT */
  .about{
    background:linear-gradient(180deg, transparent, rgba(58,13,13,0.35) 40%, transparent);
    border-top:1px solid var(--line);
    border-bottom:1px solid var(--line);
  }
  .about .wrap{max-width:920px;}
  .about p{
    font-size:18px;
    line-height:2.05;
    color:var(--ink-dim);
    margin-bottom:22px;
  }
  .about p strong{color:var(--ink); font-weight:700;}
  .about p.lead{
    font-size:21px;
    line-height:1.9;
    color:var(--ink);
    font-weight:500;
  }
  .about-en{
    margin-top:36px;
    padding-top:32px;
    border-top:1px dashed var(--line);
    direction:ltr;
    text-align:left;
    font-family:var(--display);
    font-weight:300;
    font-size:15.5px;
    line-height:1.9;
    color:var(--ink-faint);
  }

  /* STATS */
  .stats-grid{
    display:grid;
    grid-template-columns:repeat(4, minmax(0,1fr));
    gap:22px;
  }
  .stat-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:32px 28px;
    position:relative;
    overflow:hidden;
    min-width:0;
    text-align:right;
    transition:transform .3s, border-color .3s, background .3s;
  }
  .stat-card::before{
    content:'';
    position:absolute;
    inset-inline-end:0;
    top:0; bottom:0;
    width:4px;
    background:linear-gradient(180deg, var(--red-bright), var(--gold));
  }
  .stat-card::after{
    content:'';
    position:absolute; inset:0;
    background:linear-gradient(135deg, rgba(225,38,28,0.08), transparent 60%);
    opacity:0;
    transition:opacity .3s;
  }
  .stat-card:hover{
    transform:translateY(-6px);
    border-color:rgba(225,38,28,0.4);
  }
  .stat-card:hover::after{opacity:1;}
  .stat-num{
    font-family:var(--display);
    font-weight:700;
    font-size:clamp(34px,4.2vw,44px);
    line-height:1;
    background:linear-gradient(90deg, var(--red-bright), var(--red));
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    margin-bottom:14px;
    position:relative;
    z-index:1;
  }
  .stat-label{
    font-family:var(--arabic);
    font-weight:600;
    font-size:15.5px;
    color:var(--gold-soft);
    letter-spacing:0.01em;
    position:relative;
    z-index:1;
  }

  /* CLIENTS */
  .clients-grid{
    display:grid;
    grid-template-columns:repeat(4, minmax(0,1fr));
    gap:1px;
    background:var(--line);
    border:1px solid var(--line);
    border-radius:14px;
    overflow:hidden;
  }
  .client-cell{
    background:var(--bg-black);
    aspect-ratio:16/10;
    display:flex;align-items:center;justify-content:center;
    padding:20px;
    min-width:0;
    transition:background .3s;
  }
  .client-cell:hover{background:rgba(225,38,28,0.06);}
  .client-cell{flex-direction:column; gap:10px;}
  .client-cell .client-icon{
    width:26px;height:26px;
    color:var(--gold);
    opacity:0.85;
    transition:color .3s, opacity .3s;
  }
  .client-cell:hover .client-icon{color:var(--red-bright); opacity:1;}
 .client-cell{flex-direction:column; gap:10px;}
.client-logo{
  max-width:97%;
  max-height:85px;
  object-fit:contain;
  
  transition:filter .3s, opacity .3s;
}
.client-cell:hover .client-logo{
  filter:none;
  opacity:1;
}
  .client-cell:hover span{color:var(--gold-soft);}
  .client-cell.add-new{
    color:var(--ink-faint);
    font-size:26px;
    border:1px dashed rgba(244,237,233,0.15);
  }

  /* SERVICES */
  .services-grid{
    display:grid;
    grid-template-columns:repeat(3, minmax(0,1fr));
    gap:22px;
  }
  .service-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:34px 30px;
    min-width:0;
    transition:transform .3s, border-color .3s, background .3s;
    position:relative;
    overflow:hidden;
  }
  .service-card::before{
    content:'';
    position:absolute; inset:0;
    background:linear-gradient(135deg, rgba(225,38,28,0.10), transparent 55%);
    opacity:0;
    transition:opacity .3s;
  }
  .service-card:hover{
    transform:translateY(-6px);
    border-color:rgba(225,38,28,0.4);
  }
  .service-card:hover::before{opacity:1;}
  .service-icon{
    width:48px;height:48px;
    border-radius:12px;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg, rgba(225,38,28,0.16), rgba(232,165,61,0.08));
    border:1px solid rgba(232,165,61,0.25);
    margin-bottom:20px;
    color:var(--gold-soft);
    position:relative;
    transition:border-color .3s, color .3s, transform .3s;
  }
  .service-icon svg{width:23px;height:23px;}
  .service-card:hover .service-icon{
    border-color:rgba(225,38,28,0.5);
    color:var(--red-bright);
    transform:translateY(-2px);
  }
  .service-tag{
    display:inline-block;
    font-family:var(--display);
    font-size:12px;
    letter-spacing:0.22em;
    font-weight:700;
    color:var(--red-bright);
    background:rgba(225,38,28,0.12);
    border:1px solid rgba(225,38,28,0.3);
    padding:5px 13px;
    border-radius:5px;
    margin-bottom:20px;
  }
  .service-card h3{
    font-size:22px;
    font-weight:800;
    margin-bottom:12px;
    position:relative;
  }
  .service-card p{
    color:var(--ink-dim);
    font-size:15px;
    line-height:1.85;
    position:relative;
  }

  /* CASE STUDIES */
  .case-list{display:flex; flex-direction:column;}
  .case-item{
    display:grid;
    grid-template-columns:110px minmax(0,1fr) 160px;
    align-items:center;
    gap:28px;
    padding:34px 8px;
    border-bottom:1px solid var(--line);
    transition:background .25s;
  }
  .case-item:first-child{border-top:1px solid var(--line);}
  .case-item:hover{background:rgba(225,38,28,0.045);}
  .case-num{
    font-family:var(--display);
    font-size:42px;
    font-weight:700;
    color:transparent;
    -webkit-text-stroke:1.4px var(--gold);
    line-height:1;
  }
  .case-body h3{
    font-size:23px;
    font-weight:800;
    margin-bottom:8px;
    display:flex; align-items:center; gap:12px;
    flex-wrap:wrap;
  }
  .case-body .cat{
    font-family:var(--display);
    font-size:11px;
    letter-spacing:0.15em;
    color:var(--gold);
    font-weight:600;
    text-transform:uppercase;
    border:1px solid rgba(232,165,61,0.35);
    padding:3px 10px;
    border-radius:20px;
    display:inline-flex;
    align-items:center;
    gap:5px;
  }
  .cat svg{width:11px;height:11px;}
  .case-body p{
    color:var(--ink-dim);
    font-size:15px;
    line-height:1.8;
    max-width:640px;
  }
  .case-item a{
    justify-self:start;
    display:block;
    width:100%;
    max-width:160px;
  }
  .case-item img{
    width:100%;
    height:auto;
    border-radius:8px;
  }
  .case-link{
    justify-self:start;
    font-family:var(--display);
    font-size:13px;
    font-weight:600;
    letter-spacing:0.05em;
    color:var(--ink-faint);
    border:1px solid var(--line);
    padding:10px 18px;
    border-radius:6px;
    transition:all .25s;
    white-space:nowrap;
    display:inline-flex;
    align-items:center;
    gap:8px;
  }
  .case-link svg{width:14px;height:14px;}
  .case-link:hover{
    color:#fff;
    border-color:var(--red);
    background:rgba(225,38,28,0.12);
  }

  /* CTA STRIP */
  .cta-strip{
    background:linear-gradient(135deg, var(--bg-mid), var(--bg-black) 70%);
    border-top:1px solid var(--line);
    border-bottom:1px solid var(--line);
    text-align:center;
  }
  .cta-strip h2{
    font-size:clamp(26px,4vw,44px);
    font-weight:800;
    max-width:760px;
    margin:0 auto 30px;
    line-height:1.5;
  }
  .cta-strip .accent{color:var(--gold);}

  /* FOOTER */
  footer{padding:70px 0 40px;}
  .footer-top{
    display:flex; justify-content:space-between; flex-wrap:wrap; gap:40px;
    padding-bottom:50px; border-bottom:1px solid var(--line); margin-bottom:36px;
  }
  .footer-brand img{height:30px; filter:brightness(0) invert(1); margin-bottom:14px;}
  .footer-brand p{color:var(--ink-faint); font-size:14px; max-width:280px; line-height:1.8;}
  .footer-col h4{
    font-family:var(--display);
    font-size:12.5px; letter-spacing:0.2em; text-transform:uppercase;
    color:var(--gold); margin-bottom:18px; font-weight:600;
    display:flex; align-items:center; gap:9px;
  }
  .footer-col h4 svg{width:15px;height:15px;}
  .footer-col ul li{margin-bottom:12px; color:var(--ink-dim); font-size:15px; display:flex; align-items:center; gap:9px;}
  .footer-col ul li svg{width:15px;height:15px; color:var(--ink-faint); flex-shrink:0;}
  .footer-col ul li a:hover{color:var(--gold-soft);}
  .footer-bottom{
    display:flex; justify-content:space-between; flex-wrap:wrap; gap:14px;
    color:var(--ink-faint); font-size:13px;
  }
  .footer-social{display:flex; gap:18px;}
  .footer-social a{color:var(--ink-dim); font-family:var(--display); font-size:13px; font-weight:500; display:inline-flex; align-items:center; gap:7px;}
  .footer-social a svg{width:15px;height:15px;}
  .footer-social a:hover{color:var(--red-bright);}

  .reveal{opacity:0; transform:translateY(30px); transition:opacity .8s ease, transform .8s ease;}
  .reveal.in{opacity:1; transform:translateY(0);}

  /* MOBILE */
  .burger{display:none; flex-direction:column; gap:5px; cursor:pointer; z-index:200;}
  .burger span{width:24px; height:2px; background:var(--ink);}

  @media (max-width:980px){
    .stats-grid{grid-template-columns:repeat(2,minmax(0,1fr));}
    .services-grid{grid-template-columns:repeat(2,minmax(0,1fr));}
    .clients-grid{grid-template-columns:repeat(3,minmax(0,1fr));}
    .case-item{grid-template-columns:1fr; text-align:right; gap:14px;}
    .case-num{font-size:30px;}
    .case-item a{max-width:280px;}
  }
  @media (max-width:760px){
    .nav-links{
      position:fixed; inset:76px 0 0 0; height:calc(100vh - 76px);
      background:rgba(12,4,3,0.98); backdrop-filter:blur(20px);
      flex-direction:column; justify-content:flex-start; padding:50px 32px; gap:26px;
      transform:translateX(100%); transition:transform .35s ease;
    }
    .nav-links.open{transform:translateX(0);}
    .nav-links a{font-size:19px;}
    .burger{display:flex;}
    .stats-grid{grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px;}
    .stat-card{padding:24px 20px;}
    .services-grid{grid-template-columns:1fr;}
    .clients-grid{grid-template-columns:repeat(2,minmax(0,1fr));}
    .footer-top{flex-direction:column;}
    .wrap{padding:0 20px;}
    .case-item a{max-width:100%;}
  }
  @media (max-width:480px){
    .stats-grid{grid-template-columns:1fr; gap:12px;}
    .stat-card{padding:22px 24px;}
    .stat-num{font-size:32px; margin-bottom:8px;}
    .stat-label{font-size:14.5px;}
    .wrap{padding:0 16px;}
  }

  /* ===== Additions for the content-driven site (do not affect the original look) ===== */
  .accent-gold{color:var(--gold);}
  .accent-red{color:var(--red-bright);}
  .pv-hidden{display:none !important;}
  .pv-more-wrap{display:flex; justify-content:center; margin-top:44px;}
  .pv-more-btn{font-family:var(--arabic);}
  .pv-more-btn svg{transition:transform .3s;}
  .pv-more-btn.expanded svg{transform:rotate(180deg);}
  .pv-loading{min-height:100vh;}
</style>
</head>

  <symbol id="i-grid" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="3" width="7" height="7" rx="1.5"/>

    <rect x="3" y="14" width="7" height="7" rx="1.5"/>
  </symbol>
  <symbol id="i-clapper" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
